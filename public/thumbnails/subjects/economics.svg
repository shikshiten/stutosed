<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F9FA" />
      <stop offset="100%" stop-color="#F1F3F5" />
    </radialGradient>

    <!-- Accent Glow -->
    <radialGradient id="accent-glow-rad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#ca8a04" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <!-- Micro-Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.035)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(0,0,0,0.035)" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />
  <rect width="1280" height="720" fill="url(#grid-pattern)" />

  <!-- Center Ambient Accent Glow -->
  <circle cx="640" cy="380" r="440" fill="url(#accent-glow-rad)" />

  <!-- ── 10% MITHILA GEOMETRIC BORDERS ── -->
  <!-- Outer Clean Hairline Border -->
  <rect x="36" y="36" width="1208" height="648" rx="20" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="1.5" />

  <!-- Inner Mithila Dashed Geometric Frame -->
  <rect x="52" y="52" width="1176" height="616" rx="14" fill="none" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="10 6" opacity="0.55" />

  <!-- 4 Corner Mithila Folk Geometric Ornaments -->
  
    <g transform="translate(68, 68) rotate(0)">
      <path d="M 0 0 L 32 0 L 32 4 L 4 4 L 4 32 L 0 32 Z" fill="#ca8a04" opacity="0.9" />
      <polygon points="14,14 26,14 26,26 14,26" fill="none" stroke="#ca8a04" stroke-width="1.4" opacity="0.85" />
      <polygon points="20,8 26,14 20,20 14,14" fill="#ca8a04" opacity="0.95" />
      <circle cx="40" cy="14" r="2.8" fill="#ca8a04" opacity="0.75" />
      <circle cx="14" cy="40" r="2.8" fill="#ca8a04" opacity="0.75" />
      <line x1="8" y1="8" x2="32" y2="32" stroke="#ca8a04" stroke-width="1.2" opacity="0.5" stroke-dasharray="3,3" />
    </g>
  
  
    <g transform="translate(1212, 68) rotate(90)">
      <path d="M 0 0 L 32 0 L 32 4 L 4 4 L 4 32 L 0 32 Z" fill="#ca8a04" opacity="0.9" />
      <polygon points="14,14 26,14 26,26 14,26" fill="none" stroke="#ca8a04" stroke-width="1.4" opacity="0.85" />
      <polygon points="20,8 26,14 20,20 14,14" fill="#ca8a04" opacity="0.95" />
      <circle cx="40" cy="14" r="2.8" fill="#ca8a04" opacity="0.75" />
      <circle cx="14" cy="40" r="2.8" fill="#ca8a04" opacity="0.75" />
      <line x1="8" y1="8" x2="32" y2="32" stroke="#ca8a04" stroke-width="1.2" opacity="0.5" stroke-dasharray="3,3" />
    </g>
  
  
    <g transform="translate(1212, 652) rotate(180)">
      <path d="M 0 0 L 32 0 L 32 4 L 4 4 L 4 32 L 0 32 Z" fill="#ca8a04" opacity="0.9" />
      <polygon points="14,14 26,14 26,26 14,26" fill="none" stroke="#ca8a04" stroke-width="1.4" opacity="0.85" />
      <polygon points="20,8 26,14 20,20 14,14" fill="#ca8a04" opacity="0.95" />
      <circle cx="40" cy="14" r="2.8" fill="#ca8a04" opacity="0.75" />
      <circle cx="14" cy="40" r="2.8" fill="#ca8a04" opacity="0.75" />
      <line x1="8" y1="8" x2="32" y2="32" stroke="#ca8a04" stroke-width="1.2" opacity="0.5" stroke-dasharray="3,3" />
    </g>
  
  
    <g transform="translate(68, 652) rotate(270)">
      <path d="M 0 0 L 32 0 L 32 4 L 4 4 L 4 32 L 0 32 Z" fill="#ca8a04" opacity="0.9" />
      <polygon points="14,14 26,14 26,26 14,26" fill="none" stroke="#ca8a04" stroke-width="1.4" opacity="0.85" />
      <polygon points="20,8 26,14 20,20 14,14" fill="#ca8a04" opacity="0.95" />
      <circle cx="40" cy="14" r="2.8" fill="#ca8a04" opacity="0.75" />
      <circle cx="14" cy="40" r="2.8" fill="#ca8a04" opacity="0.75" />
      <line x1="8" y1="8" x2="32" y2="32" stroke="#ca8a04" stroke-width="1.2" opacity="0.5" stroke-dasharray="3,3" />
    </g>
  

  <!-- Top Geometric Header Divider with Mithila Sun/Star Motif -->
  <g transform="translate(640, 145)">
    <line x1="-240" y1="0" x2="-40" y2="0" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.55" />
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#ca8a04" opacity="0.95" />
    <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="1.5" fill="#ca8a04" />
    <line x1="40" y1="0" x2="240" y2="0" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="6 4" opacity="0.55" />
  </g>

  <!-- Category Eyebrow Pill -->
  <g transform="translate(640, 200)">
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="17" font-weight="700" letter-spacing="4.5" fill="#ca8a04" text-transform="uppercase">
      GENERAL STUDIES • COMMERCE
    </text>
  </g>

  <!-- ── DOMINANT SUBJECT TYPOGRAPHY ── -->
  <g>
    <text x="640" y="390" text-anchor="middle" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="90" font-weight="800" letter-spacing="-0.5" fill="#111827">ECONOMICS</text>
  </g>

  <!-- Bottom Mithila Divider &amp; Stutosed Wordmark Anchor -->
  <g transform="translate(640, 565)">
    <line x1="-160" y1="0" x2="-25" y2="0" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-dasharray="4 4" />
    <polygon points="0,-5 5,0 0,5 -5,0" fill="#ca8a04" opacity="0.85" />
    <line x1="25" y1="0" x2="160" y2="0" stroke="rgba(0,0,0,0.15)" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <g transform="translate(640, 610)">
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" letter-spacing="3" fill="rgba(0,0,0,0.45)">
      STUTOSED • STUDY VAULT
    </text>
  </g>
</svg>